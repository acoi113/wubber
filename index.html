<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8C%3C/text%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wubber POS" />
<title>Wubber POS & Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #3D6690; }
  body {
    font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
    color: #26374A;
    padding: 16px;
    padding-bottom: 40px;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid #FDE9A6;
    outline-offset: 2px;
  }
  .heading { font-family: 'Baloo 2', sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .logo {
    background: #FBF3D6; border: 3px solid #A9D3EA; border-radius: 14px;
    padding: 5px 14px; font-weight: 800; font-size: 22px; color: #3D6690;
    box-shadow: 0 3px 0 #A9D3EA;
  }
  
  .pudding-badge {
    background: #FDFBF3;
    border: 2px dashed #C9A227;
    border-radius: 20px;
    padding: 4px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #5A4826;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .pudding-badge .count-num {
    color: #3D6690;
    font-size: 15px;
  }

  .headerRight { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: rgba(255,255,255,0.12); color: #F3F8FC; font-size: 12.5px;
    font-weight: 700; padding: 7px 12px; border-radius: 10px; border: none;
  }
  .pill.active { background: #A9D3EA; color: #20425F; }
  .pill.offline { background: #B34545; color: #fff; }
  .pill.online { background: #3A8F5C; color: #fff; }

  .stock-badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #EADFAF; color: #6B4A20; }
  .stock-badge.low { background: #F8D7DA; color: #721C24; }
  .stock-badge.out { background: #B34545; color: #fff; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); font-weight: 700; font-size: 12.5px; color: #F3F8FC; }
  .filter-btn.selected { background: #FDFBF3; border-color: #FDFBF3; color: #3D6690; }

  .tag.status-pending { background: #FBE8B8; color: #6B4A20; }
  .tag.status-pre-order { background: #FBE8B8; color: #6B4A20; }
  .tag.status-fulfilled { background: #C9EAD2; color: #245A34; }
  .fulfill-form { background: #fff; border-radius: 10px; padding: 10px; margin-top: 10px; }

  .row-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .mini-btn { border: none; border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 11.5px; }
  .mini-btn.fulfill { background: #3A8F5C; color: #fff; }
  .mini-btn.void { background: #B34545; color: #fff; }
  .mini-btn.export { background: #3D6690; color: #fff; }

  .stock-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .stock-row .fn { font-weight: 700; font-size: 13.5px; color: #26374A; }
  .stock-row input { width: 80px; padding: 6px 8px; }

  h1.title {
    color: #fff; font-size: 26px; font-weight: 800; margin: 4px 0 14px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }

  .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .sticky { position: static !important; } }

  .field-card {
    background: #FDFBF3; border-radius: 16px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  label.label { display: block; font-size: 12.5px; font-weight: 700; color: #5A5A48; margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #E4DCC3;
    font-size: 15px; font-weight: 600; color: #26374A; background: #fff;
  }
  textarea { resize: vertical; min-height: 56px; }

  .toggle-row { display: flex; gap: 8px; margin-top: 4px; }
  .toggle-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 2px solid #E4DCC3;
    background: #fff; font-weight: 700; font-size: 13.5px; color: #5A5A48;
  }
  .toggle-btn.selected { background: #3D6690; border-color: #3D6690; color: #fff; }

  .flavors { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 14px; }
  .flavor-card {
    background: #FBF0C4; border-radius: 18px; padding: 16px 14px 14px; position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12); border: 3px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .flavor-card.has-qty { border-color: #3D6690; }
  .flavor-card:hover { transform: translateY(-2px); }
  .flavor-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .price-pill { background: #A9D3EA; color: #20425F; font-weight: 800; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  .flavor-card h3 { color: #3D6690; font-size: 17.5px; font-weight: 800; margin: 8px 0 5px; }
  .flavor-card p { font-size: 12px; color: #4A4230; line-height: 1.4; margin: 0 0 12px; min-height: 44px; }
  .add-btn { width: 100%; background: #3D6690; color: #fff; border: none; border-radius: 10px; padding: 10px 0; font-weight: 800; font-size: 13.5px; }
  .qty-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 10px; padding: 6px 8px; }
  .qty-btn { border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 17px; font-weight: 800; }
  .qty-minus { background: #EADFAF; color: #3D6690; }
  .qty-plus { background: #3D6690; color: #fff; }

  .cart-panel { background: #FDFBF3; border-radius: 18px; padding: 18px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
  .cart-panel h2 { font-size: 19px; font-weight: 800; color: #3D6690; margin: 0 0 12px; }
  .cart-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #E4DCC3; font-size: 13.5px; }
  .cart-line .nm { font-weight: 700; color: #26374A; }
  .cart-line .qy { color: #8A8A78; font-size: 11.5px; }
  .cart-line .sub { font-weight: 800; color: #26374A; }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 2px solid #26374A; margin-top: 4px; }
  .total-row .lbl { font-weight: 800; font-size: 15.5px; color: #26374A; }
  .total-row .val { font-weight: 800; font-size: 21px; color: #3D6690; }

  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .pay-btn { padding: 12px 4px; border-radius: 10px; border: 2px solid #E4DCC3; background: #fff; font-weight: 800; font-size: 13px; color: #5A5A48; }
  .pay-btn.selected { background: #3D6690; border-color: #3D6690; color: #fff; }

  .charge-btn { width: 100%; background: #3D6690; color: #fff; border: none; border-radius: 12px; padding: 13px 0; font-weight: 800; font-size: 15px; margin-top: 16px; }
  .charge-btn[disabled] { background: #C9D3DC; }
  .clear-btn { width: 100%; background: transparent; color: #8A5A3A; border: none; font-weight: 700; font-size: 12.5px; padding: 8px 0 0; }
  .hint { color: #8A8A78; font-size: 13px; margin: 14px 0; }

  /* Receipt */
  .receipt { max-width: 380px; margin: 30px auto; background: #FDFBF3; border-radius: 18px; padding: 24px 22px; box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
  .receipt .rname { text-align: center; font-weight: 800; font-size: 21px; color: #3D6690; }
  .receipt .rsub { text-align: center; font-size: 12px; color: #8A8A78; margin-bottom: 10px; }
  .receipt .rmeta { display: flex; justify-content: space-between; font-size: 11.5px; color: #5A5A48; margin-bottom: 10px; }
  .receipt .rline { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #26374A; }
  .receipt .rrow { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; color: #26374A; font-size: 14px; }
  .receipt .rrow.bold { font-weight: 800; }
  .receipt hr { border: none; border-top: 1px dashed #D8CFA9; margin: 10px 0; }
  .receipt .thanks { text-align: center; font-size: 12.5px; color: #8A5A3A; font-weight: 700; margin-top: 14px; }

  /* Sales & Expense log */
  .sales-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 16px; }
  .sum-card { background: #FDFBF3; border-radius: 14px; padding: 12px 14px; box-shadow: 0 5px 12px rgba(0,0,0,0.12); }
  .sum-card .k { font-size: 11.5px; color: #8A8A78; font-weight: 700; }
  .sum-card .v { font-size: 19px; font-weight: 800; color: #3D6690; }
  .order-item { background: #FDFBF3; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; box-shadow: 0 5px 12px rgba(0,0,0,0.1); }
  .order-item .top { display: flex; justify-content: space-between; align-items: baseline; }
  .order-item .oname { font-weight: 800; color: #26374A; font-size: 15px; }
  .order-item .otime { font-size: 11px; color: #8A8A78; }
  .order-item .odetail { font-size: 12.5px; color: #4A4230; margin-top: 4px; }
  .oline { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: #26374A; }
  .oline .oq { font-weight: 800; color: #3D6690; margin-right: 6px; }
  .otubs { font-weight: 800; color: #8A5A3A; font-size: 12.5px; margin-top: 6px; }
  .order-item .otags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #A9D3EA; color: #20425F; }
  .tag.pay { background: #EADFAF; color: #6B4A20; }
  .tag.expense { background: #F8D7DA; color: #721C24; }
  .order-item .ototal { font-weight: 800; color: #3D6690; font-size: 15px; }
  .empty { text-align: center; color: #DCEBF7; padding: 40px 10px; font-weight: 600; }
</style>

  <div id="orderView"></div>

  <div id="salesView" style="display:none;"></div>

  <div id="restockView" style="display:none;"></div>
</div>

  var salesList = [];
  var expenseList = [];
  var cashoutList = [];
  var restockList = [];
  var inventory = {};
  var state; // declared below, referenced by listeners

  function syncOrderCount() {
    var nextOrderNum = salesList.length + 1;
    state.orderNum = nextOrderNum;
    var pill = document.getElementById('orderNumPill');
    if (pill) pill.textContent = 'Order #' + String(nextOrderNum).padStart(3, '0');

    var totalTubs = salesList.reduce(function(sum, order) {
      if (!isFulfilled(order)) return sum;
      return sum + (order.lines ? order.lines.reduce(function(lSum, line) { return lSum + line.qty; }, 0) : 0);
    }, 0);
    var tubEl = document.getElementById('tubCounter');
    if (tubEl) tubEl.textContent = totalTubs;
  }

  function updateConnStatusPill() {
    var pill = document.getElementById('connStatusPill');
    if (!pill) return;
    if (navigator.onLine) {
      pill.style.display = 'none';
    } else {
      pill.style.display = '';
      pill.className = 'pill offline';
      pill.textContent = '\u26A0\uFE0F Offline \u2013 saving locally';
    }
  }
  window.addEventListener('online', updateConnStatusPill);
  window.addEventListener('offline', updateConnStatusPill);

  window.addEventListener('load', function() {
    updateConnStatusPill();
    var checkInterval = setInterval(function() {
      if (window.FirebaseDB && window.FirebaseDB.db) {
        clearInterval(checkInterval);
        var fdb = window.FirebaseDB;

        var qSales = fdb.query(fdb.collection(fdb.db, "sales"), fdb.orderBy("time", "desc"));
        fdb.onSnapshot(qSales, function(snapshot) {
          salesList = [];
          snapshot.forEach(function(doc) { salesList.push(Object.assign({ id: doc.id }, doc.data())); });
          syncOrderCount();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Sales sync error:', err);
          alert('Could not load sales data: ' + err.message);
        });

        var qExpenses = fdb.query(fdb.collection(fdb.db, "expenses"), fdb.orderBy("time", "desc"));
        fdb.onSnapshot(qExpenses, function(snapshot) {
          expenseList = [];
          snapshot.forEach(function(doc) { expenseList.push(Object.assign({ id: doc.id }, doc.data())); });
          if (state.view === 'expense') renderExpenseView();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Expense sync error:', err);
          alert('Could not load expense data: ' + err.message);
        });

        var qCashouts = fdb.query(fdb.collection(fdb.db, "cashouts"), fdb.orderBy("time", "desc"));
        fdb.onSnapshot(qCashouts, function(snapshot) {
          cashoutList = [];
          snapshot.forEach(function(doc) { cashoutList.push(Object.assign({ id: doc.id }, doc.data())); });
          if (state.view === 'expense') renderExpenseView();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Cash out sync error:', err);
          alert('Could not load cash out data: ' + err.message);
        });

        var qRestock = fdb.query(fdb.collection(fdb.db, "restock"), fdb.orderBy("addedAt", "desc"));
        fdb.onSnapshot(qRestock, function(snapshot) {
          restockList = [];
          snapshot.forEach(function(doc) { restockList.push(Object.assign({ id: doc.id }, doc.data())); });

  function peso(n) { return '\u20B1' + (n || 0).toFixed(2); }

  function fmtDate(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function parseLocalDate(dateInput) {
    if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
      var parts = dateInput.split('-');
      return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }
    return new Date(dateInput);
  }

  function isInRange(dateInput, range, customDate) {
    if (range === 'all') return true;
    var d = parseLocalDate(dateInput);
    if (isNaN(d.getTime())) return true;
    var now = new Date();
    if (range === 'today') {
      return d.toDateString() === now.toDateString();
    }
    if (range === 'week') {
      var weekAgo = new Date(now);
      weekAgo.setDate(now.getDate() - 7);
      weekAgo.setHours(0, 0, 0, 0);
      return d >= weekAgo && d <= now;
    }
    if (range === 'month') {
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if (range === 'date') {
      if (!customDate) return true;
      var target = parseLocalDate(customDate);
      return d.toDateString() === target.toDateString();
    }
    return true;
  }

  function monthKeyOf(dateInput) {
    var d = parseLocalDate(dateInput);
    if (isNaN(d.getTime())) return 'unknown';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function monthLabel(key) {
    if (key === 'unknown') return 'Unknown date';
    var parts = key.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
  }

  function getStock(flavorId) {
    return (inventory && typeof inventory[flavorId] === 'number') ? inventory[flavorId] : null;

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function isPreOrderDate(dateStr) {
    if (!dateStr) return false;

  function isFulfilled(o) {

  function cartTotal() {

  function loyaltyDiscountInfo() {

    var flavor = FLAVORS.find(function (f) { return f.id === state.loyaltyFlavorId; });
    if (!flavor || flavor.category !== 'pudding') return null;
    var qty = state.cart[flavor.id] || 0;
    if (qty < 1) return null;
    var pct = state.loyaltyTier === '50' ? 0.5 : 0.1;
    return { flavorId: flavor.id, flavorName: flavor.name, tier: state.loyaltyTier, pct: pct, amount: flavor.price * pct };

      '<ellipse cx="32" cy="24" rx="18" ry="6" fill="' + tone + '" stroke="#8A6636" stroke-width="1.5"/>' +

  function wireOrderView() {
    var root = document.getElementById('orderView');
    var cancelEditBtn = document.getElementById('cancelEditBtn');
    if (cancelEditBtn) {
      cancelEditBtn.addEventListener('click', function () {
        state.editingOrderId = null;
        state.cart = {};
        state.customerName = '';
        state.delivery = 'Pickup';
        state.address = '';
        state.fulfillDate = '';
        state.payment = 'Cash';
        state.cash = '';
        state.orderNotes = '';
        state.deliveryFee = '';
        state.loyaltyEnabled = false;
        state.loyaltyFlavorId = '';
        state.loyaltyTier = '10';
        renderOrderView();
      });
    }
    root.querySelectorAll('[data-add]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var id = btn.getAttribute('data-add');
        var stock = getStock(id);
        var currentQty = state.cart[id] || 0;
        if (stock !== null && currentQty >= stock) return;
        state.cart[id] = currentQty + 1;
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-remove');
        if (state.cart[id]) {
          state.cart[id] -= 1;
          if (state.cart[id] <= 0) delete state.cart[id];
        }
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-delivery]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.delivery = btn.getAttribute('data-delivery');
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-payment]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.payment = btn.getAttribute('data-payment');
        renderOrderView();
      });
    });
    var loyaltyToggle = document.getElementById('loyaltyToggle');
    if (loyaltyToggle) {
      loyaltyToggle.addEventListener('change', function () {
        state.loyaltyEnabled = loyaltyToggle.checked;
        if (!state.loyaltyEnabled) state.loyaltyFlavorId = '';
        renderOrderView();
      });
    }
    var loyaltyFlavorSelect = document.getElementById('loyaltyFlavorSelect');
    if (loyaltyFlavorSelect) {
      loyaltyFlavorSelect.addEventListener('change', function () {
        state.loyaltyFlavorId = loyaltyFlavorSelect.value;
        renderOrderView();
      });
    }
    root.querySelectorAll('[data-loyalty-tier]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.loyaltyTier = btn.getAttribute('data-loyalty-tier');
        renderOrderView();
      });
    });
    var nameInput = document.getElementById('custName');
    if (nameInput) {
      nameInput.addEventListener('input', function () {
        state.customerName = nameInput.value;
        checkCanCharge();
      });
    }
    var addrInput = document.getElementById('addr');
    if (addrInput) {
      addrInput.addEventListener('input', function () {
        state.address = addrInput.value;
        checkCanCharge();
      });
    }
    var deliveryFeeInput = document.getElementById('deliveryFeeInput');
    if (deliveryFeeInput) {
      deliveryFeeInput.addEventListener('input', function () {
        state.deliveryFee = deliveryFeeInput.value;
        renderOrderView();
        var el = document.getElementById('deliveryFeeInput');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var fulfillDateInput = document.getElementById('fulfillDate');
    if (fulfillDateInput) {
      fulfillDateInput.addEventListener('input', function () {
        state.fulfillDate = fulfillDateInput.value;
        renderOrderView();
      });
    }
    var cashInput = document.getElementById('cashInput');
    if (cashInput) {
      cashInput.addEventListener('input', function () {
        state.cash = cashInput.value;
        renderOrderView();
        var el = document.getElementById('cashInput');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var orderNotesInput = document.getElementById('orderNotesInput');
    if (orderNotesInput) {
      orderNotesInput.addEventListener('input', function () {
        state.orderNotes = orderNotesInput.value;
      });
    }
    var chargeBtn = document.getElementById('chargeBtn');
    if (chargeBtn) chargeBtn.addEventListener('click', charge);
    var clearBtn = document.getElementById('clearBtn');
    if (clearBtn) clearBtn.addEventListener('click', function () {
      state.cart = {};
      renderOrderView();
    });
  }

  function checkCanCharge() {
    var chargeBtn = document.getElementById('chargeBtn');
    var lines = cartLines();
    var discountInfo = loyaltyDiscountInfo();
    var deliveryFeeNum = state.delivery === 'Delivery' ? (parseFloat(state.deliveryFee) || 0) : 0;
    var total = cartTotal() - (discountInfo ? discountInfo.amount : 0) + deliveryFeeNum;
    var cashNum = parseFloat(state.cash) || 0;
    var isPreOrder = isPreOrderDate(state.fulfillDate);
    var canCharge = lines.length > 0 && state.customerName.trim().length > 0 &&
      (state.delivery === 'Pickup' || state.address.trim().length > 0) &&
      state.fulfillDate.trim().length > 0 && (isPreOrder || cashNum >= total);
    if (chargeBtn) chargeBtn.disabled = !canCharge;
  }

  function editOrder(o) {
    state.editingOrderId = o.id;
    state.cart = {};
    (o.lines || []).forEach(function (l) { state.cart[l.id] = l.qty; });
    state.customerName = o.name || '';
    state.delivery = o.delivery || 'Pickup';
    state.address = o.address || '';
    state.fulfillDate = o.fulfillDate || '';
    state.payment = o.payment || 'Cash';
    state.cash = o.cash != null ? String(o.cash) : '';
    state.orderNotes = o.notes || '';
    state.deliveryFee = o.deliveryFee != null ? String(o.deliveryFee) : '';
    state.loyaltyEnabled = !!(o.discount && o.discount.amount);
    state.loyaltyFlavorId = o.discount ? o.discount.flavorId : '';
    state.loyaltyTier = o.discount ? o.discount.tier : '10';
    renderOrderView();
    showView('order');
  }

  function charge() {
    var lines = cartLines();
    var subtotal = cartTotal();
    var discountInfo = loyaltyDiscountInfo();
    var deliveryFeeNum = state.delivery === 'Delivery' ? (parseFloat(state.deliveryFee) || 0) : 0;
    var total = subtotal - (discountInfo ? discountInfo.amount : 0) + deliveryFeeNum;
    var cashNum = parseFloat(state.cash) || 0;
    var isPreOrder = isPreOrderDate(state.fulfillDate);
    if (lines.length === 0 || !state.customerName.trim()) return;

    if (state.editingOrderId) {
      var originalOrder = salesList.find(function (o) { return o.id === state.editingOrderId; });
      var updatedFields = {
        name: state.customerName.trim(),
        delivery: state.delivery,
        address: state.delivery === 'Delivery' ? state.address.trim() : '',
        fulfillDate: state.fulfillDate,
        payment: isPreOrder ? null : state.payment,
        lines: lines,
        subtotal: subtotal,
        discount: discountInfo ? { flavorId: discountInfo.flavorId, flavorName: discountInfo.flavorName, tier: discountInfo.tier, amount: discountInfo.amount } : null,
        deliveryFee: deliveryFeeNum || null,
        total: total,
        cash: isPreOrder ? null : cashNum,
        change: isPreOrder ? null : (cashNum - total),
        status: isPreOrder ? 'Pre-order' : 'Fulfilled',
        notes: state.orderNotes.trim() || null,
        editedAt: new Date().toISOString()
      };

      if (window.FirebaseDB && window.FirebaseDB.db) {
        var fdb2 = window.FirebaseDB;
        withErr(fdb2.updateDoc(fdb2.doc(fdb2.db, "sales", state.editingOrderId), updatedFields), 'update the order');

        var oldQtyById = {};
        (originalOrder && originalOrder.lines ? originalOrder.lines : []).forEach(function (l) { oldQtyById[l.id] = (oldQtyById[l.id] || 0) + l.qty; });
        var newQtyById = {};
        lines.forEach(function (l) { newQtyById[l.id] = (newQtyById[l.id] || 0) + l.qty; });
        var stockDelta = {};
        Object.keys(Object.assign({}, oldQtyById, newQtyById)).forEach(function (id) {
          var delta = (newQtyById[id] || 0) - (oldQtyById[id] || 0);
          if (delta !== 0 && getStock(id) !== null) stockDelta[id] = fdb2.increment(-delta);
        });
        if (Object.keys(stockDelta).length > 0) {
          withErr(fdb2.setDoc(fdb2.doc(fdb2.db, "meta", "inventory"), stockDelta, { merge: true }), 'update stock');
        }
      }

      state.editingOrderId = null;
      state.cart = {};
      state.customerName = '';
      state.delivery = 'Pickup';
      state.address = '';
      state.fulfillDate = '';
      state.payment = 'Cash';
      state.cash = '';
      state.orderNotes = '';
      state.loyaltyEnabled = false;
      state.loyaltyFlavorId = '';
      state.loyaltyTier = '10';
      state.deliveryFee = '';

      renderOrderView();
      showView('sales');
      renderSalesView();
      return;
    }

    var order = {
      num: state.orderNum,
      name: state.customerName.trim(),
      delivery: state.delivery,
      address: state.delivery === 'Delivery' ? state.address.trim() : '',
      fulfillDate: state.fulfillDate,
      payment: isPreOrder ? null : state.payment,
      lines: lines,
      subtotal: subtotal,
      discount: discountInfo ? { flavorId: discountInfo.flavorId, flavorName: discountInfo.flavorName, tier: discountInfo.tier, amount: discountInfo.amount } : null,
      deliveryFee: deliveryFeeNum || null,
      total: total,
      cash: isPreOrder ? null : cashNum,
      change: isPreOrder ? null : (cashNum - total),
      status: isPreOrder ? 'Pre-order' : 'Fulfilled',
      notes: state.orderNotes.trim() || null,
      time: new Date().toISOString()
    };

    if (window.FirebaseDB && window.FirebaseDB.db) {
      var fdb = window.FirebaseDB;
      withErr(fdb.addDoc(fdb.collection(fdb.db, "sales"), order), 'save the order');

      var stockUpdates = {};
      lines.forEach(function (l) {
        if (getStock(l.id) !== null) stockUpdates[l.id] = fdb.increment(-l.qty);
      });
      if (Object.keys(stockUpdates).length > 0) {
        withErr(fdb.setDoc(fdb.doc(fdb.db, "meta", "inventory"), stockUpdates, { merge: true }), 'update stock');
      }
    }

    renderReceipt(order);

    state.cart = {};
    state.customerName = '';
    state.delivery = 'Pickup';
    state.address = '';
    state.fulfillDate = '';
    state.payment = 'Cash';
    state.cash = '';
    state.orderNotes = '';
    state.loyaltyEnabled = false;
    state.loyaltyFlavorId = '';
    state.loyaltyTier = '10';
    state.deliveryFee = '';

    showView('receipt');
  }

    (order.lines || []).forEach(function (l) {
      html += '<div class="rline"><span>' + l.qty + ' &times; ' + esc(l.name) + '</span><span style="font-weight:700;">' + peso(l.subtotal) + '</span></div>';

    if ((order.discount && order.discount.amount) || order.deliveryFee) {

      if (order.discount && order.discount.amount) {
        html += '<div class="rrow" style="color:#8A5A3A;"><span>Loyalty Discount (' + esc(order.discount.tier) + '% off ' + esc(order.discount.flavorName) + ')</span><span>-' + peso(order.discount.amount) + '</span></div>';
      }

      html += '<div class="rline" style="color:#8A5A3A;font-weight:700;margin-top:6px;">\uD83D\uDCC5 Pre-order &mdash; payment due on ' + (order.delivery === 'Delivery' ? 'delivery' : 'pickup') + '.</div>';

      html += '<div class="rrow"><span>Cash</span><span>' + peso(order.cash) + '</span></div>';
      html += '<div class="rrow"><span>Change</span><span>' + peso(order.change) + '</span></div>';
    }
    html += '<div class="thanks">Thanks for picking Wubber! \uD83C\uDF6E</div>';

      html += '<div class="rline" style="margin-top:6px;color:#8A8A78;"><strong>Note:</strong> ' + esc(order.notes) + '</div>';
    }
    if (order.status === 'Pre-order') {
      html += '<hr/>';
      html += '<div class="rline" style="text-align:center;font-weight:800;color:#3D6690;margin:6px 0;">No cash? No problem \u2014 scan to pay!</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function showImageSaveModal(dataUrl, filename) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,15,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;';
    var img = document.createElement('img');
    img.src = dataUrl;
    img.style.cssText = 'max-width:100%;max-height:70vh;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,0.4);';
    var hint = document.createElement('div');
    hint.textContent = '\uD83D\uDCF2 Press and hold the image, then choose "Save to Photos"';
    hint.style.cssText = 'color:#FDFBF3;font-weight:700;font-size:14px;text-align:center;';
    var closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.className = 'mini-btn void';
    closeBtn.style.cssText = 'padding:10px 20px;font-size:13px;';
    closeBtn.addEventListener('click', function () { document.body.removeChild(overlay); });
    var dlLink = document.createElement('a');
    dlLink.href = dataUrl;
    dlLink.download = filename;
    dlLink.textContent = '\u2B07 Download';
    dlLink.className = 'mini-btn fulfill';
    dlLink.style.cssText = 'padding:10px 20px;font-size:13px;text-decoration:none;';
    var btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:10px;';
    btnRow.appendChild(dlLink);
    btnRow.appendChild(closeBtn);
    overlay.appendChild(img);
    overlay.appendChild(hint);
    overlay.appendChild(btnRow);
    document.body.appendChild(overlay);
  }

  function saveReceiptImage(order, sourceEl) {
    if (typeof html2canvas === 'undefined') {
      alert('Image export isn\u2019t available right now (couldn\u2019t load the image library). Check your internet connection and try again.');
      return;
    }
    var target = sourceEl;
    var cleanupNode = null;
    if (!target) {
      cleanupNode = document.createElement('div');
      cleanupNode.className = 'receipt';
      cleanupNode.style.position = 'fixed';
      cleanupNode.style.left = '-9999px';
      cleanupNode.style.top = '0';
      cleanupNode.style.width = '380px';
      cleanupNode.innerHTML = receiptCardHtml(order);
      document.body.appendChild(cleanupNode);
      target = cleanupNode;
    }
    html2canvas(target, { backgroundColor: '#FDFBF3', scale: 2 }).then(function (canvas) {
      var filename = 'wubber-receipt-' + String(order.num).padStart(3, '0') + '.png';
      var dataUrl = canvas.toDataURL('image/png');
      if (cleanupNode) document.body.removeChild(cleanupNode);
      if (isIOS()) {
        showImageSaveModal(dataUrl, filename);
      } else {
        var link = document.createElement('a');
        link.download = filename;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }).catch(function (err) {
      console.error('Save image failed:', err);
      alert('Could not save the receipt image: ' + err.message);
      if (cleanupNode) document.body.removeChild(cleanupNode);
    });
  }

  function renderReceipt(order) {
    var html = '<div class="receipt" id="liveReceiptCard">';

    html += '</div>';
    html += '<button class="charge-btn" id="saveImageBtn" style="background:#3D6690;margin-top:10px;">\uD83D\uDCBE Save as Image</button>';
    html += '<button class="charge-btn" id="newSaleBtn">Start new order</button>';
    document.getElementById('receiptView').innerHTML = html;
    document.getElementById('newSaleBtn').addEventListener('click', function () {
      renderOrderView();
      showView('order');
    });
    document.getElementById('saveImageBtn').addEventListener('click', function () {
      saveReceiptImage(order, document.getElementById('liveReceiptCard'));
    });
  }

      html += '<div class="odetail" style="color:#8A5A3A;">\u2B50 Loyalty: -' + peso(o.discount.amount) + ' (' + esc(o.discount.tier) + '% off ' + esc(o.discount.flavorName) + ')</div>';

      html += '<div class="odetail">\uD83D\uDEF5 Delivery Fee: +' + peso(o.deliveryFee) + '</div>';

      html += '<div class="odetail">Deliver to: ' + esc(o.address) + '</div>';

    }
    html += '<div class="otags"><span class="tag">' + o.delivery + '</span>' + (o.payment ? '<span class="tag pay">' + o.payment + '</span>' : '') + '<span class="tag status-' + status.toLowerCase().replace(/\s+/g, '-') + '">' + status + '</span></div>';
    html += '<div style="display:flex;justify-content:flex-end;margin-top:6px;"><span class="ototal">' + peso(o.total) + '</span></div>';

    if (state.fulfillingId === o.id) {
      var cashNum = parseFloat(state.fulfillDraft.cash) || 0;
      html += '<div class="fulfill-form">';
      html += '<label class="label">Payment method received</label>';
      html += '<div class="pay-grid">';
      PAYMENTS.forEach(function (p) {
        html += '<button class="pay-btn' + (state.fulfillDraft.payment === p ? ' selected' : '') + '" data-fulfill-payment="' + p + '">' + p + '</button>';
      });
      html += '</div>';
      html += '<label class="label" style="margin-top:10px;">Cash received</label>';
      html += '<input type="text" inputmode="decimal" id="fulfillCashInput" placeholder="0.00" value="' + esc(state.fulfillDraft.cash) + '" />';
      html += '<div class="hint" style="margin:6px 0;">Change: ' + peso(Math.max(cashNum - o.total, 0)) + '</div>';
      html += '<div class="row-actions">';
      html += '<button class="mini-btn void" data-cancel-fulfill="1">Cancel</button>';

      html += '</div>';
      html += '</div>';

      html += '<div class="row-actions">';
      if (!fulfilled) {
        html += '<button class="mini-btn fulfill" data-start-fulfill="' + o.id + '">Mark Fulfilled</button>';
      }
      html += '<button class="mini-btn fulfill" data-edit-order="' + o.id + '">\u270F\uFE0F Edit</button>';
      html += '<button class="mini-btn export" data-save-receipt="' + o.id + '">\uD83D\uDCBE Save Receipt</button>';
      html += '<button class="mini-btn void" data-void-order="' + o.id + '">Void</button>';

  function renderSalesView() {
    var filter = state.salesDate ? 'date' : state.salesFilter;
    var searchTerm = state.salesSearch.trim().toLowerCase();
    var filteredSales = salesList.filter(function (o) { return !isFulfilled(o) || isInRange(o.fulfillDate || o.time, filter, state.salesDate); });
    var filteredExpenses = expenseList.filter(function (e) { return isInRange(e.purchaseDate || e.time, filter, state.salesDate); });
    var filteredCashouts = cashoutList.filter(function (c) { return isInRange(c.purchaseDate || c.time, filter, state.salesDate); });

    var totalRevenue = filteredSales.reduce(function (s, o) { return isFulfilled(o) ? s + o.total : s; }, 0);
    var totalPending = filteredSales.reduce(function (s, o) { return isFulfilled(o) ? s : s + o.total; }, 0);
    var totalExpenses = filteredExpenses.reduce(function (s, e) { return s + e.amount; }, 0);
    var totalCashOut = filteredCashouts.reduce(function (s, c) { return s + c.amount; }, 0);
    var netProfit = totalRevenue - totalExpenses;
    var availableBalance = netProfit - totalCashOut;

    var paymentTotals = {};
    PAYMENTS.forEach(function (p) { paymentTotals[p] = { received: 0, spent: 0 }; });
    filteredSales.forEach(function (o) {
      if (isFulfilled(o) && o.payment && paymentTotals.hasOwnProperty(o.payment)) {
        paymentTotals[o.payment].received += o.total;
      }
    });
    filteredExpenses.forEach(function (e) {
      var pv = e.paidVia || 'Cash';
      if (paymentTotals.hasOwnProperty(pv)) paymentTotals[pv].spent += e.amount;
    });
    filteredCashouts.forEach(function (c) {
      var pv = c.paidVia || 'Cash';
      if (paymentTotals.hasOwnProperty(pv)) paymentTotals[pv].spent += c.amount;
    });

    var html = '<h1 class="title heading">Sales & Budget Dashboard</h1>';

    html += '<div class="filter-row">';
    [['all', 'All Time'], ['today', 'Today'], ['week', 'This Week'], ['month', 'This Month']].forEach(function (f) {
      html += '<button class="filter-btn' + (filter === f[0] && !state.salesDate ? ' selected' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
    });
    html += '<input type="date" id="salesDateInput" value="' + esc(state.salesDate) + '" style="padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:700;" />';
    if (state.salesDate) {
      html += '<button class="filter-btn" id="clearSalesDateBtn">\u2715 Clear date</button>';
    }
    html += '<button class="filter-btn mini-btn export" id="exportCsvBtn" style="margin-left:auto;">\u2B07 Export CSV</button>';
    html += '</div>';

    html += '<div class="sales-summary">';
    html += '<div class="sum-card"><div class="k">Total Sales</div><div class="v">' + peso(totalRevenue) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Pending (Pre-orders)</div><div class="v" style="color:#8A5A3A;">' + peso(totalPending) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Total Expenses</div><div class="v" style="color:#B34545;">' + peso(totalExpenses) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Net Profit</div><div class="v" style="color:' + (netProfit < 0 ? '#B34545' : '#3A8F5C') + ';">' + peso(netProfit) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Cash Withdrawn</div><div class="v" style="color:#8A5A3A;">' + peso(totalCashOut) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Available Balance</div><div class="v" style="color:' + (availableBalance < 0 ? '#B34545' : '#3A8F5C') + ';">' + peso(availableBalance) + '</div></div>';
    html += '<div class="sum-card"><div class="k">Orders</div><div class="v">' + filteredSales.length + '</div></div>';
    html += '</div>';

    html += '<div class="field-card">';
    html += '<h2 class="heading" style="font-size:17px;color:#3D6690;margin:0 0 10px;">Money by Payment Method</h2>';
    PAYMENTS.forEach(function (p) {
      var net = paymentTotals[p].received - paymentTotals[p].spent;
      html += '<div class="stock-row" style="flex-direction:column;align-items:stretch;gap:4px;">';
      html += '<div style="display:flex;justify-content:space-between;"><span class="fn">' + esc(p) + '</span><span style="font-weight:800;color:' + (net < 0 ? '#B34545' : '#3A8F5C') + ';">' + peso(net) + '</span></div>';
      html += '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8A8A78;"><span>Received: ' + peso(paymentTotals[p].received) + '</span><span>Spent: ' + peso(paymentTotals[p].spent) + '</span></div>';
      html += '</div>';
    });
    html += '</div>';

    var otherFlavors = FLAVORS.filter(function (f) { return f.category === 'others'; });
    if (otherFlavors.length > 0) {
      var otherTotals = {};
      otherFlavors.forEach(function (f) { otherTotals[f.id] = { qty: 0, revenue: 0 }; });
      filteredSales.forEach(function (o) {
        if (!isFulfilled(o) || !o.lines) return;
        o.lines.forEach(function (l) {
          if (otherTotals.hasOwnProperty(l.id)) {
            otherTotals[l.id].qty += l.qty;
            otherTotals[l.id].revenue += (l.subtotal != null ? l.subtotal : l.price * l.qty);
          }
        });
      });

      html += '<div class="field-card">';
      html += '<h2 class="heading" style="font-size:17px;color:#3D6690;margin:0 0 10px;">Other Products \u2014 Sales</h2>';
      otherFlavors.forEach(function (f) {
        html += '<div class="stock-row">';
        html += '<span class="fn">' + esc(f.name) + ' <span style="color:#8A8A78;font-weight:600;">(' + otherTotals[f.id].qty + ' sold)</span></span>';
        html += '<span style="font-weight:800;color:#3D6690;">' + peso(otherTotals[f.id].revenue) + '</span>';
        html += '</div>';
      });
      html += '<div class="hint" style="margin:6px 0 0;">Reflects whatever date filter is currently selected above.</div>';
      html += '</div>';

      html += '<div class="field-card">';
      html += '<h2 class="heading" style="font-size:17px;color:#3D6690;margin:0 0 10px;">Other Products \u2014 Stock</h2>';
      otherFlavors.forEach(function (f) {
        var stock = getStock(f.id);
        html += '<div class="stock-row">';
        html += '<span class="fn">' + esc(f.name) + '</span>';
        html += '<div style="display:flex;align-items:center;gap:8px;">';
        html += '<input type="number" min="0" data-stock-input="' + f.id + '" placeholder="' + (stock === null ? 'not tracked' : stock) + '" />';
        html += '<button class="mini-btn fulfill" data-set-stock="' + f.id + '">Set</button>';
        html += '</div></div>';
      });
      html += '<div class="hint" style="margin:6px 0 0;">Set a stock number to start tracking. Leave untouched for unlimited stock.</div>';
      html += '</div>';
    }

    html += '<input type="text" id="salesSearchInput" placeholder="\uD83D\uDD0D Search by customer name" value="' + esc(state.salesSearch) + '" style="margin-bottom:14px;" />';

    var matchesSearch = function (o) { return !searchTerm || o.name.toLowerCase().indexOf(searchTerm) !== -1; };
    var preOrders = filteredSales.filter(function (o) { return !isFulfilled(o) && matchesSearch(o); })
      .sort(function (a, b) { return (a.fulfillDate || '').localeCompare(b.fulfillDate || ''); });
    var fulfilledOrders = filteredSales.filter(function (o) { return isFulfilled(o) && matchesSearch(o); });

    if (preOrders.length > 0) {
      html += '<h2 class="heading" style="font-size:16px;color:#8A5A3A;margin:0 0 8px;">\u23F3 Pending Pre-orders (' + preOrders.length + ')</h2>';
      preOrders.forEach(function (o) { html += renderOrderCard(o); });
    }

    html += '<h2 class="heading" style="font-size:16px;color:#3D6690;margin:16px 0 8px;">Fulfilled Orders</h2>';
    if (fulfilledOrders.length === 0) {
      html += '<div class="empty">No fulfilled sales found.</div>';
    } else {
      var groups = {};
      fulfilledOrders.forEach(function (o) {
        var key = monthKeyOf(o.fulfillDate || o.time);
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });
      var keys = Object.keys(groups).sort().reverse();
      keys.forEach(function (key) {
        var items = groups[key];
        var groupTotal = items.reduce(function (s, o) { return s + o.total; }, 0);
        var expanded = state.salesExpanded.hasOwnProperty(key) ? state.salesExpanded[key] : (key === monthKeyOf(todayStr()));
        html += '<button class="month-toggle" data-toggle-sales-month="' + key + '" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.12);border:none;border-radius:10px;padding:10px 14px;margin-bottom:8px;">';

  function csvEscape(v) {
    var s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv() {
    var filter = state.salesDate ? 'date' : state.salesFilter;
    var filteredSales = salesList.filter(function (o) { return !isFulfilled(o) || isInRange(o.fulfillDate || o.time, filter, state.salesDate); });
    var filteredExpenses = expenseList.filter(function (e) { return isInRange(e.purchaseDate || e.time, filter, state.salesDate); });
    var filteredCashouts = cashoutList.filter(function (c) { return isInRange(c.purchaseDate || c.time, filter, state.salesDate); });

    var lines = [];
    lines.push('SALES');
    lines.push(['Order #', 'Date', 'Customer', 'Items', 'Delivery', 'Payment', 'Status', 'Total', 'Notes'].join(','));
    filteredSales.forEach(function (o) {
      var items = o.lines ? o.lines.map(function (l) { return l.qty + 'x ' + l.name; }).join('; ') : '';
      lines.push([String(o.num).padStart(3, '0'), fmtDate(o.fulfillDate) || new Date(o.time).toLocaleDateString(), o.name, items, o.delivery, o.payment, o.status || 'Fulfilled', o.total.toFixed(2), o.notes].map(csvEscape).join(','));
    });
    lines.push('');
    lines.push('EXPENSES');
    lines.push(['Date', 'Description', 'Category', 'Amount', 'Notes'].join(','));
    filteredExpenses.forEach(function (e) {
      lines.push([e.purchaseDate ? fmtDate(e.purchaseDate) : new Date(e.time).toLocaleDateString(), e.title, e.category, e.amount.toFixed(2), e.notes].map(csvEscape).join(','));
    });
    lines.push('');
    lines.push('CASH OUT');
    lines.push(['Date', 'Note', 'Amount'].join(','));
    filteredCashouts.forEach(function (c) {
      lines.push([c.purchaseDate ? fmtDate(c.purchaseDate) : new Date(c.time).toLocaleDateString(), c.note, c.amount.toFixed(2)].map(csvEscape).join(','));
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'wubber-sales-' + filter + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderMoneyGroups(list, kind, expandedMap, toggleAttr) {
    var groups = {};
    list.forEach(function (item) {
      var key = monthKeyOf(item.purchaseDate || item.time);
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    });
    var keys = Object.keys(groups).sort().reverse();
    var html = '';
    keys.forEach(function (key) {
      var items = groups[key];
      var groupTotal = items.reduce(function (s, i) { return s + i.amount; }, 0);
      var expanded = expandedMap.hasOwnProperty(key) ? expandedMap[key] : (key === monthKeyOf(todayStr()));
      html += '<button class="month-toggle" ' + toggleAttr + '="' + key + '" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.12);border:none;border-radius:10px;padding:10px 14px;margin-bottom:8px;">';
      html += '<span style="font-weight:800;color:#F3F8FC;font-size:14.5px;">' + (expanded ? '\u25BC ' : '\u25B6 ') + monthLabel(key) + ' (' + items.length + ')</span>';
      html += '<span style="font-weight:800;color:#F3F8FC;">-' + peso(groupTotal) + '</span>';
      html += '</button>';
      if (expanded) {
        items.forEach(function (item) {
          var dateLabel = item.purchaseDate ? fmtDate(item.purchaseDate) : new Date(item.time).toLocaleDateString();
          html += '<div class="order-item">';
          if (kind === 'expense') {
            html += '<div class="top"><span class="oname">' + esc(item.title) + '</span><span class="otime">' + dateLabel + '</span></div>';
            html += '<div class="otags"><span class="tag expense">' + esc(item.category) + '</span><span class="tag pay">' + esc(item.paidVia || 'Cash') + '</span></div>';
          } else {
            html += '<div class="top"><span class="oname">Cash Out</span><span class="otime">' + dateLabel + '</span></div>';
            html += '<div class="otags"><span class="tag pay">' + esc(item.paidVia || 'Cash') + '</span></div>';
          }
          if (item.notes || item.note) {
            html += '<div class="odetail" style="font-style:italic;">' + esc(item.notes || item.note) + '</div>';
          }
          html += '<div style="display:flex;justify-content:flex-end;margin-top:6px;"><span class="ototal" style="color:#B34545;">-' + peso(item.amount) + '</span></div>';
          html += '<div class="row-actions"><button class="mini-btn void" data-delete-' + kind + '="' + item.id + '">Delete</button></div>';
          html += '</div>';
        });
      }
    });
    return html;
  }

    document.getElementById('navSalesBtn').classList.toggle('active', v === 'sales');
    document.getElementById('navExpenseBtn').classList.toggle('active', v === 'expense');
    document.getElementById('navRestockBtn').classList.toggle('active', v === 'restock');
  }

  document.getElementById('navOrderBtn').addEventListener('click', function () {
    renderOrderView();
    showView('order');
  });
  document.getElementById('navSalesBtn').addEventListener('click', function () {
    renderSalesView();
    showView('sales');
  });
  document.getElementById('navExpenseBtn').addEventListener('click', function () {
    renderExpenseView();
    showView('expense');
  });

  document.getElementById('navRestockBtn').addEventListener('click', function () {
    renderRestockView();
    showView('restock');
  });

  renderOrderView();
  showView('order');
})();
</script>
</body>
</html>
