<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8C%3C/text%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wubber POS" />
<title>Wubber POS & Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #3D6690; }
  body {
    font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
    color: #26374A;
    padding: 16px;
    padding-bottom: 40px;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid #FDE9A6;
    outline-offset: 2px;
  }
  .heading { font-family: 'Baloo 2', sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .logo {
    background: #FBF3D6; border: 3px solid #A9D3EA; border-radius: 14px;
    padding: 5px 14px; font-weight: 800; font-size: 22px; color: #3D6690;
    box-shadow: 0 3px 0 #A9D3EA;
  }
  
  .pudding-badge {
    background: #FDFBF3;
    border: 2px dashed #C9A227;
    border-radius: 20px;
    padding: 4px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #5A4826;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .pudding-badge .count-num {
    color: #3D6690;
    font-size: 15px;
  }

  .headerRight { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    background: rgba(255,255,255,0.12); color: #F3F8FC; font-size: 12.5px;
    font-weight: 700; padding: 7px 12px; border-radius: 10px; border: none;
  }
  .pill.active { background: #A9D3EA; color: #20425F; }
  .pill.offline { background: #B34545; color: #fff; }
  .pill.online { background: #3A8F5C; color: #fff; }

  .stock-badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #EADFAF; color: #6B4A20; }
  .stock-badge.low { background: #F8D7DA; color: #721C24; }
  .stock-badge.out { background: #B34545; color: #fff; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn { padding: 8px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); font-weight: 700; font-size: 12.5px; color: #F3F8FC; }
  .filter-btn.selected { background: #FDFBF3; border-color: #FDFBF3; color: #3D6690; }

  .tag.status-pending { background: #FBE8B8; color: #6B4A20; }
  .tag.status-pre-order { background: #FBE8B8; color: #6B4A20; }
  .tag.status-fulfilled { background: #C9EAD2; color: #245A34; }
  .fulfill-form { background: #fff; border-radius: 10px; padding: 10px; margin-top: 10px; }

  .row-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .mini-btn { border: none; border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 11.5px; }
  .mini-btn.fulfill { background: #3A8F5C; color: #fff; }
  .mini-btn.void { background: #B34545; color: #fff; }
  .mini-btn.export { background: #3D6690; color: #fff; }

  .stock-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .stock-row .fn { font-weight: 700; font-size: 13.5px; color: #26374A; }
  .stock-row input { width: 80px; padding: 6px 8px; }

  h1.title {
    color: #fff; font-size: 26px; font-weight: 800; margin: 4px 0 14px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }

  .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .sticky { position: static !important; } }

  .field-card {
    background: #FDFBF3; border-radius: 16px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  label.label { display: block; font-size: 12.5px; font-weight: 700; color: #5A5A48; margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #E4DCC3;
    font-size: 15px; font-weight: 600; color: #26374A; background: #fff;
  }
  textarea { resize: vertical; min-height: 56px; }

  .toggle-row { display: flex; gap: 8px; margin-top: 4px; }
  .toggle-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 2px solid #E4DCC3;
    background: #fff; font-weight: 700; font-size: 13.5px; color: #5A5A48;
  }
  .toggle-btn.selected { background: #3D6690; border-color: #3D6690; color: #fff; }

  .flavors { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 14px; }
  .flavor-card {
    background: #FBF0C4; border-radius: 18px; padding: 16px 14px 14px; position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12); border: 3px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .flavor-card.has-qty { border-color: #3D6690; }
  .flavor-card:hover { transform: translateY(-2px); }
  .flavor-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .price-pill { background: #A9D3EA; color: #20425F; font-weight: 800; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  .flavor-card h3 { color: #3D6690; font-size: 17.5px; font-weight: 800; margin: 8px 0 5px; }
  .flavor-card p { font-size: 12px; color: #4A4230; line-height: 1.4; margin: 0 0 12px; min-height: 44px; }
  .add-btn { width: 100%; background: #3D6690; color: #fff; border: none; border-radius: 10px; padding: 10px 0; font-weight: 800; font-size: 13.5px; }
  .qty-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 10px; padding: 6px 8px; }
  .qty-btn { border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 17px; font-weight: 800; }
  .qty-minus { background: #EADFAF; color: #3D6690; }
  .qty-plus { background: #3D6690; color: #fff; }

  .cart-panel { background: #FDFBF3; border-radius: 18px; padding: 18px; box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
  .cart-panel h2 { font-size: 19px; font-weight: 800; color: #3D6690; margin: 0 0 12px; }
  .cart-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #E4DCC3; font-size: 13.5px; }
  .cart-line .nm { font-weight: 700; color: #26374A; }
  .cart-line .qy { color: #8A8A78; font-size: 11.5px; }
  .cart-line .sub { font-weight: 800; color: #26374A; }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 2px solid #26374A; margin-top: 4px; }
  .total-row .lbl { font-weight: 800; font-size: 15.5px; color: #26374A; }
  .total-row .val { font-weight: 800; font-size: 21px; color: #3D6690; }

  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .pay-btn { padding: 12px 4px; border-radius: 10px; border: 2px solid #E4DCC3; background: #fff; font-weight: 800; font-size: 13px; color: #5A5A48; }
  .pay-btn.selected { background: #3D6690; border-color: #3D6690; color: #fff; }

  .charge-btn { width: 100%; background: #3D6690; color: #fff; border: none; border-radius: 12px; padding: 13px 0; font-weight: 800; font-size: 15px; margin-top: 16px; }
  .charge-btn[disabled] { background: #C9D3DC; }
  .clear-btn { width: 100%; background: transparent; color: #8A5A3A; border: none; font-weight: 700; font-size: 12.5px; padding: 8px 0 0; }
  .hint { color: #8A8A78; font-size: 13px; margin: 14px 0; }

  /* Receipt */
  .receipt { max-width: 380px; margin: 30px auto; background: #FDFBF3; border-radius: 18px; padding: 24px 22px; box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
  .receipt .rname { text-align: center; font-weight: 800; font-size: 21px; color: #3D6690; }
  .receipt .rsub { text-align: center; font-size: 12px; color: #8A8A78; margin-bottom: 10px; }
  .receipt .rmeta { display: flex; justify-content: space-between; font-size: 11.5px; color: #5A5A48; margin-bottom: 10px; }
  .receipt .rline { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #26374A; }
  .receipt .rrow { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; color: #26374A; font-size: 14px; }
  .receipt .rrow.bold { font-weight: 800; }
  .receipt hr { border: none; border-top: 1px dashed #D8CFA9; margin: 10px 0; }
  .receipt .thanks { text-align: center; font-size: 12.5px; color: #8A5A3A; font-weight: 700; margin-top: 14px; }

  /* Sales & Expense log */
  .sales-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 16px; }
  .sum-card { background: #FDFBF3; border-radius: 14px; padding: 12px 14px; box-shadow: 0 5px 12px rgba(0,0,0,0.12); }
  .sum-card .k { font-size: 11.5px; color: #8A8A78; font-weight: 700; }
  .sum-card .v { font-size: 19px; font-weight: 800; color: #3D6690; }
  .order-item { background: #FDFBF3; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; box-shadow: 0 5px 12px rgba(0,0,0,0.1); }
  .order-item .top { display: flex; justify-content: space-between; align-items: baseline; }
  .order-item .oname { font-weight: 800; color: #26374A; font-size: 15px; }
  .order-item .otime { font-size: 11px; color: #8A8A78; }
  .order-item .odetail { font-size: 12.5px; color: #4A4230; margin-top: 4px; }
  .order-item .otags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #A9D3EA; color: #20425F; }
  .tag.pay { background: #EADFAF; color: #6B4A20; }
  .tag.expense { background: #F8D7DA; color: #721C24; }
  .order-item .ototal { font-weight: 800; color: #3D6690; font-size: 15px; }
  .empty { text-align: center; color: #DCEBF7; padding: 40px 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="logo">WUBBER</div>
      <div class="pudding-badge">
        <span>🍮 Tubs Sold:</span>
        <span class="count-num" id="tubCounter">0</span>
      </div>
    </div>
    <div class="headerRight">
      <span class="pill" id="connStatusPill" style="display:none;"></span>
      <button class="pill" id="orderNumPill">Order #001</button>
      <button class="pill" id="navOrderBtn">New Order</button>
      <button class="pill" id="navSalesBtn">Sales Log</button>
      <button class="pill" id="navExpenseBtn">Expenses</button>
    </div>
  </header>

  <div id="orderView"></div>
  <div id="receiptView" style="display:none;"></div>
  <div id="salesView" style="display:none;"></div>
  <div id="expenseView" style="display:none;"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, query, orderBy,
    doc, updateDoc, deleteDoc, setDoc, increment
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDg1npnQ-9LTIYPsG2098HbExxa9O4KDuY",
    authDomain: "wubber-86f4e.firebaseapp.com",
    projectId: "wubber-86f4e",
    storageBucket: "wubber-86f4e.firebasestorage.app",
    messagingSenderId: "931166076336",
    appId: "1:931166076336:web:411c88cbc84063525b2a75",
    measurementId: "G-9HLM9S0NSJ"
  };

  let db = null;
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch(e) {
    console.warn("Firebase fallback active.", e);
  }

  window.FirebaseDB = {
    db, addDoc, collection, onSnapshot, query, orderBy,
    doc, updateDoc, deleteDoc, setDoc, increment
  };
</script>

<script>
(function () {
  var FLAVORS = [
    { id: 'classic', name: 'Classic Banana', price: 150, blurb: 'Fresh bananas, silky vanilla pudding, soft cookies & cream.', tone: '#EFE0A3', swirl: '#C9A227' },
    { id: 'chocnut', name: 'Banana Chocnut', price: 170, blurb: 'Creamy banana pudding loaded with rich, nutty Chocnut.', tone: '#DCC7A1', swirl: '#7A4A2B' },
    { id: 'caramel', name: 'Salted Caramel Crunch', price: 180, blurb: 'Sweet-salty caramel, creamy pudding, crispy cornflake crunch.', tone: '#E7B77A', swirl: '#B4692A' }
  ];
  var PAYMENTS = ['Cash', 'GCash', 'RCBC', 'GoTyme'];

  var salesList = [];
  var expenseList = [];
  var inventory = {};
  var state; // declared below, referenced by listeners

  function syncOrderCount() {
    var nextOrderNum = salesList.length + 1;
    state.orderNum = nextOrderNum;
    var pill = document.getElementById('orderNumPill');
    if (pill) pill.textContent = 'Order #' + String(nextOrderNum).padStart(3, '0');

    var totalTubs = salesList.reduce(function(sum, order) {
      if (!isFulfilled(order)) return sum;
      return sum + (order.lines ? order.lines.reduce(function(lSum, line) { return lSum + line.qty; }, 0) : 0);
    }, 0);
    var tubEl = document.getElementById('tubCounter');
    if (tubEl) tubEl.textContent = totalTubs;
  }

  function updateConnStatusPill() {
    var pill = document.getElementById('connStatusPill');
    if (!pill) return;
    if (navigator.onLine) {
      pill.style.display = 'none';
    } else {
      pill.style.display = '';
      pill.className = 'pill offline';
      pill.textContent = '\u26A0\uFE0F Offline \u2013 saving locally';
    }
  }
  window.addEventListener('online', updateConnStatusPill);
  window.addEventListener('offline', updateConnStatusPill);

  window.addEventListener('load', function() {
    updateConnStatusPill();
    var checkInterval = setInterval(function() {
      if (window.FirebaseDB && window.FirebaseDB.db) {
        clearInterval(checkInterval);
        var fdb = window.FirebaseDB;

        var qSales = fdb.query(fdb.collection(fdb.db, "sales"), fdb.orderBy("time", "desc"));
        fdb.onSnapshot(qSales, function(snapshot) {
          salesList = [];
          snapshot.forEach(function(doc) { salesList.push(Object.assign({ id: doc.id }, doc.data())); });
          syncOrderCount();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Sales sync error:', err);
          alert('Could not load sales data: ' + err.message);
        });

        var qExpenses = fdb.query(fdb.collection(fdb.db, "expenses"), fdb.orderBy("time", "desc"));
        fdb.onSnapshot(qExpenses, function(snapshot) {
          expenseList = [];
          snapshot.forEach(function(doc) { expenseList.push(Object.assign({ id: doc.id }, doc.data())); });
          if (state.view === 'expense') renderExpenseView();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Expense sync error:', err);
          alert('Could not load expense data: ' + err.message);
        });

        fdb.onSnapshot(fdb.doc(fdb.db, "meta", "inventory"), function(docSnap) {
          inventory = docSnap.exists() ? docSnap.data() : {};
          if (state.view === 'order') renderOrderView();
          if (state.view === 'sales') renderSalesView();
        }, function(err) {
          console.error('Inventory sync error:', err);
        });
      }
    }, 300);
  });

  state = {
    cart: {},
    customerName: '',
    delivery: 'Pickup',
    address: '',
    fulfillDate: '',
    payment: 'Cash',
    cash: '',
    orderNum: 1,
    view: 'order',
    salesFilter: 'all',
    fulfillingId: null,
    fulfillDraft: { payment: 'Cash', cash: '' }
  };

  function peso(n) { return '\u20B1' + (n || 0).toFixed(2); }

  function fmtDate(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function isInRange(dateInput, range) {
    if (range === 'all') return true;
    var d = new Date(dateInput);
    if (isNaN(d.getTime())) return true;
    var now = new Date();
    if (range === 'today') {
      return d.toDateString() === now.toDateString();
    }
    if (range === 'week') {
      var weekAgo = new Date(now);
      weekAgo.setDate(now.getDate() - 7);
      return d >= weekAgo && d <= now;
    }
    if (range === 'month') {
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    return true;
  }

  function getStock(flavorId) {
    return (inventory && typeof inventory[flavorId] === 'number') ? inventory[flavorId] : null;
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function isPreOrderDate(dateStr) {
    if (!dateStr) return false;
    return dateStr > todayStr();
  }

  function isFulfilled(o) {
    return (o.status || 'Fulfilled') === 'Fulfilled';
  }

  function cartLines() {
    return FLAVORS.filter(function (f) { return state.cart[f.id]; }).map(function (f) {
      var qty = state.cart[f.id];
      return { id: f.id, name: f.name, price: f.price, qty: qty, subtotal: qty * f.price };
    });
  }
  function cartTotal() {
    return cartLines().reduce(function (s, l) { return s + l.subtotal; }, 0);
  }

  function cupSVG(tone, swirl) {
    return '<svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true">' +
      '<path d="M14 24 L18 56 Q32 61 46 56 L50 24 Z" fill="#C89A5B" stroke="#8A6636" stroke-width="1.5"/>' +
      '<ellipse cx="32" cy="24" rx="18" ry="6" fill="' + tone + '" stroke="#8A6636" stroke-width="1.5"/>' +
      '<path d="M20 22 Q26 16 32 21 Q38 16 44 22" fill="none" stroke="' + swirl + '" stroke-width="2.4" stroke-linecap="round"/>' +
      '</svg>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function withErr(promise, label) {
    if (promise && promise.catch) {
      promise.catch(function (err) {
        console.error(label + ' failed:', err);
        alert('Could not ' + label + ': ' + err.message);
      });
    }
    return promise;
  }

  function renderOrderView() {
    var lines = cartLines();
    var total = cartTotal();
    var cashNum = parseFloat(state.cash) || 0;
    var change = cashNum - total;
    var isPreOrder = isPreOrderDate(state.fulfillDate);
    var canCharge = lines.length > 0 && state.customerName.trim().length > 0 &&
      (state.delivery === 'Pickup' || state.address.trim().length > 0) &&
      state.fulfillDate.trim().length > 0 &&
      (isPreOrder || cashNum >= total);

    var html = '';
    html += '<div class="grid">';
    html += '<div>';
    html += '<h1 class="title heading">What\'s your pick?</h1>';

    html += '<div class="field-card">';
    html += '<label class="label" for="custName">Order name</label>';
    html += '<input type="text" id="custName" placeholder="Customer name" value="' + esc(state.customerName) + '" />';

    html += '<label class="label" style="margin-top:12px;">Delivery method</label>';
    html += '<div class="toggle-row">';
    ['Pickup', 'Delivery'].forEach(function (d) {
      html += '<button class="toggle-btn' + (state.delivery === d ? ' selected' : '') + '" data-delivery="' + d + '">' + d + '</button>';
    });
    html += '</div>';

    if (state.delivery === 'Delivery') {
      html += '<label class="label" style="margin-top:12px;" for="addr">Delivery address</label>';
      html += '<textarea id="addr" placeholder="House / street, barangay, city">' + esc(state.address) + '</textarea>';
    }

    html += '<label class="label" style="margin-top:12px;" for="fulfillDate">' + (state.delivery === 'Delivery' ? 'Delivery date' : 'Pickup date') + '</label>';
    html += '<input type="date" id="fulfillDate" value="' + esc(state.fulfillDate) + '" />';
    if (isPreOrderDate(state.fulfillDate)) {
      html += '<div class="hint" style="margin:8px 0 0;color:#8A5A3A;">\uD83D\uDCC5 This is a future date, so it will be saved as a <strong>Pre-order</strong>. Payment will be collected once you mark it Fulfilled.</div>';
    }
    html += '</div>';

    html += '<div class="flavors">';
    FLAVORS.forEach(function (f) {
      var qty = state.cart[f.id] || 0;
      var stock = getStock(f.id);
      var outOfStock = stock !== null && stock <= 0;
      var atStockLimit = stock !== null && qty >= stock;

    html += '</div>';

      html += '<button class="clear-btn" id="clearBtn">Clear order</button>';

    document.getElementById('orderView').innerHTML = html;

  function wireOrderView() {
    var root = document.getElementById('orderView');
    root.querySelectorAll('[data-add]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var id = btn.getAttribute('data-add');
        var stock = getStock(id);
        var currentQty = state.cart[id] || 0;
        if (stock !== null && currentQty >= stock) return;
        state.cart[id] = currentQty + 1;
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-remove');
        if (state.cart[id]) {
          state.cart[id] -= 1;
          if (state.cart[id] <= 0) delete state.cart[id];
        }
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-delivery]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.delivery = btn.getAttribute('data-delivery');
        renderOrderView();
      });
    });
    root.querySelectorAll('[data-payment]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.payment = btn.getAttribute('data-payment');
        renderOrderView();
      });
    });
    var nameInput = document.getElementById('custName');
    if (nameInput) {
      nameInput.addEventListener('input', function () {
        state.customerName = nameInput.value;
        checkCanCharge();
      });
    }
    var addrInput = document.getElementById('addr');
    if (addrInput) {
      addrInput.addEventListener('input', function () {
        state.address = addrInput.value;
        checkCanCharge();
      });
    }
    var fulfillDateInput = document.getElementById('fulfillDate');
    if (fulfillDateInput) {
      fulfillDateInput.addEventListener('input', function () {
        state.fulfillDate = fulfillDateInput.value;
        renderOrderView();
      });
    }
    var cashInput = document.getElementById('cashInput');
    if (cashInput) {
      cashInput.addEventListener('input', function () {
        state.cash = cashInput.value;
        renderOrderView();
        var el = document.getElementById('cashInput');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var chargeBtn = document.getElementById('chargeBtn');
    if (chargeBtn) chargeBtn.addEventListener('click', charge);
    var clearBtn = document.getElementById('clearBtn');
    if (clearBtn) clearBtn.addEventListener('click', function () {
      state.cart = {};
      renderOrderView();
    });
  }

  function checkCanCharge() {
    var chargeBtn = document.getElementById('chargeBtn');
    var lines = cartLines();
    var total = cartTotal();
    var cashNum = parseFloat(state.cash) || 0;
    var isPreOrder = isPreOrderDate(state.fulfillDate);
    var canCharge = lines.length > 0 && state.customerName.trim().length > 0 &&
      (state.delivery === 'Pickup' || state.address.trim().length > 0) &&
      state.fulfillDate.trim().length > 0 && (isPreOrder || cashNum >= total);
    if (chargeBtn) chargeBtn.disabled = !canCharge;
  }

  function charge() {
    var lines = cartLines();
    var total = cartTotal();
    var cashNum = parseFloat(state.cash) || 0;
    var isPreOrder = isPreOrderDate(state.fulfillDate);
    if (lines.length === 0 || !state.customerName.trim()) return;

    var order = {
      num: state.orderNum,
      name: state.customerName.trim(),
      delivery: state.delivery,
      address: state.delivery === 'Delivery' ? state.address.trim() : '',
      fulfillDate: state.fulfillDate,
      payment: isPreOrder ? null : state.payment,
      lines: lines,
      total: total,
      cash: isPreOrder ? null : cashNum,
      change: isPreOrder ? null : (cashNum - total),
      status: isPreOrder ? 'Pre-order' : 'Fulfilled',
      time: new Date().toISOString()
    };

    if (window.FirebaseDB && window.FirebaseDB.db) {
      var fdb = window.FirebaseDB;
      withErr(fdb.addDoc(fdb.collection(fdb.db, "sales"), order), 'save the order');

      var stockUpdates = {};
      lines.forEach(function (l) {
        if (getStock(l.id) !== null) stockUpdates[l.id] = fdb.increment(-l.qty);
      });
      if (Object.keys(stockUpdates).length > 0) {
        withErr(fdb.setDoc(fdb.doc(fdb.db, "meta", "inventory"), stockUpdates, { merge: true }), 'update stock');
      }
    }

    renderReceipt(order);

    state.cart = {};
    state.customerName = '';
    state.delivery = 'Pickup';
    state.address = '';
    state.fulfillDate = '';
    state.payment = 'Cash';
    state.cash = '';

    showView('receipt');
  }

        var status = o.status || 'Fulfilled';

  function wireSalesView() {
    var root = document.getElementById('salesView');
    var fdb = window.FirebaseDB;

    root.querySelectorAll('[data-filter]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.salesFilter = btn.getAttribute('data-filter');
        renderSalesView();
      });
    });

    root.querySelectorAll('[data-set-stock]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-set-stock');
        var input = root.querySelector('[data-stock-input="' + id + '"]');
        var val = parseInt(input.value, 10);
        if (isNaN(val) || val < 0) { alert('Enter a valid stock number (0 or more).'); return; }
        if (fdb && fdb.db) {
          var update = {};
          update[id] = val;
          withErr(fdb.setDoc(fdb.doc(fdb.db, "meta", "inventory"), update, { merge: true }), 'update stock');
        }
      });
    });

    root.querySelectorAll('[data-start-fulfill]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.fulfillingId = btn.getAttribute('data-start-fulfill');
        state.fulfillDraft = { payment: 'Cash', cash: '' };
        renderSalesView();
      });
    });

    root.querySelectorAll('[data-cancel-fulfill]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.fulfillingId = null;
        renderSalesView();
      });
    });

    root.querySelectorAll('[data-fulfill-payment]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.fulfillDraft.payment = btn.getAttribute('data-fulfill-payment');
        renderSalesView();
      });
    });

    var fulfillCashInput = document.getElementById('fulfillCashInput');
    if (fulfillCashInput) {
      fulfillCashInput.addEventListener('input', function () {
        state.fulfillDraft.cash = fulfillCashInput.value;
        renderSalesView();
        var el = document.getElementById('fulfillCashInput');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }

    root.querySelectorAll('[data-confirm-fulfill]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        var id = btn.getAttribute('data-confirm-fulfill');
        var order = salesList.find(function (o) { return o.id === id; });
        var cashNum = parseFloat(state.fulfillDraft.cash) || 0;
        if (!order || cashNum < order.total) return;
        if (fdb && fdb.db) {
          withErr(fdb.updateDoc(fdb.doc(fdb.db, "sales", id), {
            status: 'Fulfilled',
            payment: state.fulfillDraft.payment,
            cash: cashNum,
            change: cashNum - order.total
          }), 'mark the order fulfilled');
        }
        state.fulfillingId = null;
      });
    });

    root.querySelectorAll('[data-void-order]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-void-order');
        var order = salesList.find(function (o) { return o.id === id; });
        if (!confirm('Void order #' + (order ? String(order.num).padStart(3, '0') : '') + '? This cannot be undone.')) return;
        if (fdb && fdb.db) {
          withErr(fdb.deleteDoc(fdb.doc(fdb.db, "sales", id)), 'void the order');
          if (order && order.lines) {
            var restock = {};
            order.lines.forEach(function (l) {
              if (getStock(l.id) !== null) restock[l.id] = fdb.increment(l.qty);
            });
            if (Object.keys(restock).length > 0) {
              withErr(fdb.setDoc(fdb.doc(fdb.db, "meta", "inventory"), restock, { merge: true }), 'restock inventory');
            }
          }
        }
      });
    });

    var exportBtn = document.getElementById('exportCsvBtn');
    if (exportBtn) exportBtn.addEventListener('click', exportCsv);
  }

  function csvEscape(v) {
    var s = String(v == null ? '' : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv() {
    var filter = state.salesFilter;
    var filteredSales = salesList.filter(function (o) { return isInRange(o.fulfillDate || o.time, filter); });
    var filteredExpenses = expenseList.filter(function (e) { return isInRange(e.purchaseDate || e.time, filter); });

    var lines = [];
    lines.push('SALES');
    lines.push(['Order #', 'Date', 'Customer', 'Items', 'Delivery', 'Payment', 'Status', 'Total'].join(','));
    filteredSales.forEach(function (o) {
      var items = o.lines ? o.lines.map(function (l) { return l.qty + 'x ' + l.name; }).join('; ') : '';
      lines.push([String(o.num).padStart(3, '0'), fmtDate(o.fulfillDate) || new Date(o.time).toLocaleDateString(), o.name, items, o.delivery, o.payment, o.status || 'Fulfilled', o.total.toFixed(2)].map(csvEscape).join(','));
    });
    lines.push('');
    lines.push('EXPENSES');
    lines.push(['Date', 'Description', 'Category', 'Amount'].join(','));
    filteredExpenses.forEach(function (e) {
      lines.push([e.purchaseDate ? fmtDate(e.purchaseDate) : new Date(e.time).toLocaleDateString(), e.title, e.category, e.amount.toFixed(2)].map(csvEscape).join(','));
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'wubber-sales-' + filter + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-delete-expense');
        if (!confirm('Delete this expense? This cannot be undone.')) return;
        if (window.FirebaseDB && window.FirebaseDB.db) {
          var fdb = window.FirebaseDB;
          withErr(fdb.deleteDoc(fdb.doc(fdb.db, "expenses", id)), 'delete the expense');
        }
      });
    });

    document.getElementById('saveExpenseBtn').addEventListener('click', function() {
      var title = document.getElementById('expTitle').value.trim();
      var category = document.getElementById('expCategory').value;
      var amount = parseFloat(document.getElementById('expAmount').value) || 0;
      var purchaseDate = document.getElementById('expDate').value;

      if(!title || amount <= 0 || !purchaseDate) {
        alert('Please fill out all fields correctly.');
        return;
      }

      var expenseData = {
        title: title,
        category: category,
        amount: amount,
        purchaseDate: purchaseDate,
        time: new Date().toISOString()
      };

      if (window.FirebaseDB && window.FirebaseDB.db) {
        var fdb = window.FirebaseDB;
        withErr(fdb.addDoc(fdb.collection(fdb.db, "expenses"), expenseData), 'save the expense');
      }
    });
  }

  function showView(v) {
    state.view = v;
    document.getElementById('orderView').style.display = v === 'order' ? '' : 'none';
    document.getElementById('receiptView').style.display = v === 'receipt' ? '' : 'none';
    document.getElementById('salesView').style.display = v === 'sales' ? '' : 'none';
    document.getElementById('expenseView').style.display = v === 'expense' ? '' : 'none';
    document.getElementById('navOrderBtn').classList.toggle('active', v === 'order' || v === 'receipt');
    document.getElementById('navSalesBtn').classList.toggle('active', v === 'sales');
    document.getElementById('navExpenseBtn').classList.toggle('active', v === 'expense');
  }

  document.getElementById('navOrderBtn').addEventListener('click', function () {
    renderOrderView();
    showView('order');
  });
  document.getElementById('navSalesBtn').addEventListener('click', function () {
    renderSalesView();
    showView('sales');
  });
  document.getElementById('navExpenseBtn').addEventListener('click', function () {
    renderExpenseView();
    showView('expense');
  });

  renderOrderView();
  showView('order');
})();
</script>
</body>
</html>
